<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CELE TEST BANK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Serif+4:opsz,wght@8..60,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar over one working column; the exam view adds a question-navigator rail beside the question */
:root{
  --bg:#f1f6ee; --surface:#fbfdf9; --surface-2:#e6efe2; --fg:#12251a; --muted:#4f655a; --line:#cddac9;
  --accent:#1b6a39; --accent-fg:#ffffff; --accent-soft:#d8ebdb; --accent-line:#8fbf9d;
  --good:#1b6a39; --good-soft:#d4ebd8; --bad:#a3301f; --bad-soft:#f6dcd6; --warn:#8f5200; --warn-soft:#f5e7c6;
  --s-mstc:#2f7d3f; --s-hge:#0f766e; --s-psad:#6c8c1c;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1912; --surface:#15251b; --surface-2:#1c3024; --fg:#e3efe5; --muted:#93ab9a; --line:#2a4132;
  --accent:#5dc283; --accent-fg:#08170e; --accent-soft:#1d3d29; --accent-line:#2f6b45;
  --good:#6fd392; --good-soft:#1b3b27; --bad:#f08a78; --bad-soft:#3d1f1a; --warn:#e8b45a; --warn-soft:#3a2d12;
  --s-mstc:#6fd392; --s-hge:#4cc7bb; --s-psad:#b3d45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1912; --surface:#15251b; --surface-2:#1c3024; --fg:#e3efe5; --muted:#93ab9a; --line:#2a4132;
  --accent:#5dc283; --accent-fg:#08170e; --accent-soft:#1d3d29; --accent-line:#2f6b45;
  --good:#6fd392; --good-soft:#1b3b27; --bad:#f08a78; --bad-soft:#3d1f1a; --warn:#e8b45a; --warn-soft:#3a2d12;
  --s-mstc:#6fd392; --s-hge:#4cc7bb; --s-psad:#b3d45a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin-inline:auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:13px;font-weight:800}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-top:28px;display:grid;gap:24px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 11px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}
textarea{min-height:110px;resize:vertical;font-family:var(--font-body);font-size:16px;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel>h2{font-size:20px;margin-bottom:4px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted)}
.page-title{font-size:30px;letter-spacing:-.02em}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.status b{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.status.local b{background:var(--warn)}
.notice{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.subj{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;display:grid;gap:10px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.subj .code{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--c)}
.subj .count{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.m{--c:var(--s-mstc)} .h{--c:var(--s-hge)} .p{--c:var(--s-psad)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}

/* setup form */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.chk .n{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

/* sections under each main subject */
.secbox{display:grid;gap:10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.subj .pill{font-size:12px;padding:3px 10px}
.sec-add{display:flex;gap:8px;flex-wrap:wrap}
.sec-add input{flex:1 1 140px;padding:6px 10px;font-size:13px;width:auto}
.secrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.secrow input{max-width:260px}
.secres{display:grid;gap:3px;margin:-6px 0 4px 82px;font-size:13px;color:var(--muted)}
.secres div{display:flex;justify-content:space-between;gap:12px}
@media (max-width:620px){.secres{margin-left:0}}
.chk-wrap{display:grid;gap:6px}
.chk-wrap select{padding:6px 10px;font-size:13px}

/* bank list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.qlist{display:grid;gap:12px}
.qitem{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:10px;min-width:0}
.qitem .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qitem .acts{margin-left:auto;display:flex;gap:8px}
.qtext{font-family:var(--font-body);font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.qtext p+p{margin-top:.7em}
.qtext mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden}
.qmeta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.opts-mini{margin:0;padding-left:0;list-style:none;display:grid;gap:4px;font-family:var(--font-body);font-size:15px}
.opts-mini li{display:flex;gap:8px;min-width:0}
.opts-mini li.ok{color:var(--good);font-weight:600}
.opts-mini .k{font-family:var(--font-mono);font-size:12px;flex:none;padding-top:3px;width:18px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:20px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.editor{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0}
.eqbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.eqbar button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;font-family:var(--font-mono);font-size:13px;min-width:34px}
.eqbar button:hover{border-color:var(--accent);color:var(--accent)}
.eqbar .sep{width:1px;background:var(--line);margin:2px 2px}
.preview{border:1px dashed var(--accent-line);border-radius:10px;padding:14px;background:var(--surface);min-height:56px}
.preview.off .qtext{color:var(--muted)}
.drop{border:2px dashed var(--accent-line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fig{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.fig img{display:block;width:100%;height:120px;object-fit:contain}
.fig button{position:absolute;top:6px;right:6px}
.choice{display:grid;grid-template-columns:auto 28px minmax(0,1fr) auto;gap:10px;align-items:center}
.choice .k{font-family:var(--font-mono);font-weight:600;color:var(--muted)}
.choice input[type=checkbox],.choice input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.sw input{accent-color:var(--accent);width:18px;height:18px}

/* exam */
.exam-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.exam-head .bar-in{justify-content:space-between}
.timer{font-family:var(--font-mono);font-weight:600;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:120px;flex:1 1 140px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:860px){.exam-grid{grid-template-columns:minmax(0,1fr)}.nav-panel{order:2}}
.qcard{padding:24px}
.qno{font-family:var(--font-mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qbody{font-family:var(--font-body);font-size:19px;line-height:1.65;margin-block:14px;overflow-wrap:anywhere}
.qbody p+p{margin-top:.8em}
.qbody mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden}
.qfigs{display:grid;gap:12px;margin-block:12px}
.qfigs img{max-width:100%;max-height:340px;display:block;margin-inline:auto;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}
.qfigs img.zoom{max-height:none;cursor:zoom-out}
.choices{display:grid;gap:10px;margin-top:16px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:var(--font-body);font-size:17px;line-height:1.55}
.opt:hover{border-color:var(--accent-line)}
.opt .k{font-family:var(--font-mono);font-weight:600;font-size:14px;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.nav-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
@media (max-width:860px){.nav-panel{position:static}}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-block:12px}
.nb{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-family:var(--font-mono);font-size:13px;font-weight:600;position:relative;padding:0}
.nb.done{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nb.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.nb.cur{outline:3px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.legend i.d{background:var(--accent);border-color:var(--accent)}
.legend i.f{background:var(--warn);border-color:var(--warn);border-radius:50%}
.flagbtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* situation problems */
.sitbox{border:1px solid var(--accent-line);border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin-block:12px;min-width:0}
.sit-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag.sit{--c:var(--accent)}
.sitbox .qbody{font-size:17px;margin:0}
.sitbox .qtext{margin:0}
.sitbox .qfigs{margin:0}
.subq{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px;min-width:0}
.sitcard{border-left:6px solid var(--accent)}
.qblock{display:grid;gap:14px}
.eqbar.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:6}
.blk-acts{display:flex;gap:6px;flex-wrap:wrap}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,15,9,.62);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:460px;width:100%;display:grid;gap:14px}
.dlg h2{font-size:22px}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:620px){.score{grid-template-columns:minmax(0,1fr)}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-weight:800;font-size:30px;line-height:1.1}
.ring small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.verdict{font-size:26px;font-weight:800;letter-spacing:-.02em}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:70px minmax(0,1fr) 90px;gap:12px;align-items:center}
.bar-track{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--c)}
.bar-row .v{font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--muted)}
.rev{border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:16px;background:var(--surface);display:grid;gap:10px;min-width:0}
.rev.ok{border-left-color:var(--good)} .rev.no{border-left-color:var(--bad)} .rev.skip{border-left-color:var(--warn)}
.rev .opts-mini li.mine{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.rev .opts-mini li.ok.mine{text-decoration:none}
.expl{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-family:var(--font-body)}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-block:6px}
.hist .pf{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style>

</script>

<body>
<div class="bar"><div class="bar-in">
  <div class="brand"><i>CT</i><span>CELE TEST BANK</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></div>
<div class="wrap"><main id="app" aria-live="polite"></main></div>

<script>
(function(){
'use strict';
var SUBJECTS=[{code:'MSTC',cls:'m'},{code:'HGE',cls:'h'},{code:'PSAD',cls:'p'}];
var LS_Q='bes.q.v1',LS_EXAM='bes.exam.v1',LS_HIST='bes.hist.v1',LS_SET='bes.set.v1',LS_SEC='bes.sec.v1';
var LS_SIT='bes.sit.v1';
var LETTERS='ABCDEF';

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];
    if(k.slice(0,5)==='aria-'){if(v!=null)el.setAttribute(k,String(v));continue}
    if(v===false||v==null)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(el,x)});return}
  el.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));
}
function clear(el){while(el.firstChild)el.removeChild(el.firstChild)}
function uid(){return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function subjCls(code){for(var i=0;i<SUBJECTS.length;i++)if(SUBJECTS[i].code===code)return SUBJECTS[i].cls;return 'm'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtTime(s){s=Math.max(0,Math.round(s));var hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  return (hh?hh+':':'')+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function say(t){var s=$('#say');if(s)s.textContent=t}
var toastTimer;
function toast(t){var old=$('.toast');if(old)old.remove();var el=h('div',{class:'toast',role:'status',text:t});document.body.appendChild(el);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.remove()},2600)}

/* ---------- math rendering (MathJax SVG, no external CSS needed) ---------- */
/* MathJax must measure text size, so it only runs on elements already attached to the page.
   Elements are queued, then typeset together a moment later (after the screen has been built). */
var mathQ=[],mathSched=false,mathTries=0,mathChain=Promise.resolve();
function typeset(el){
  if(mathQ.indexOf(el)<0)mathQ.push(el);
  if(!mathSched){mathSched=true;setTimeout(flushMath,40)}
}
function flushMath(){
  mathSched=false;
  mathQ=mathQ.filter(function(e){return e.isConnected});
  if(!mathQ.length){mathTries=0;return}
  var M=window.MathJax;
  if(!(M&&M.typesetPromise)){if(++mathTries<150){mathSched=true;setTimeout(flushMath,200)}return}
  mathTries=0;
  var list=mathQ;mathQ=[];
  mathChain=mathChain.then(function(){
    list=list.filter(function(e){return e.isConnected});
    list=list.filter(function(e){return !list.some(function(o){return o!==e&&o.contains(e)})});
    if(!list.length)return;
    try{if(M.typesetClear)M.typesetClear()}catch(x){}
    return M.typesetPromise(list);
  }).catch(function(){});
}
/* write plain text (with $...$ math) into el as paragraphs, then typeset */
function setRich(el,text){
  clear(el);
  var paras=String(text||'').split(/\n{2,}/);
  paras.forEach(function(p){
    var node=h('p');var lines=p.split('\n');
    lines.forEach(function(l,i){if(i)node.appendChild(document.createElement('br'));node.appendChild(document.createTextNode(l))});
    el.appendChild(node);
  });
  typeset(el);
}

/* ---------- question store: account (db) when available, else this browser ---------- */
function normSec(o){
  var r={};SUBJECTS.forEach(function(s){
    var a=o&&Array.isArray(o[s.code])?o[s.code]:[];
    r[s.code]=a.filter(function(x,i){return typeof x==='string'&&x.trim()&&a.indexOf(x)===i}).map(function(x){return x.trim().slice(0,40)});
  });return r;
}
var Store={mode:'local',items:[],sits:[],sections:normSec(null),col:null,ready:false,onChange:function(){},synced:false,canEdit:true,seeded:false,privDocs:[],privCol:null};
function loadLocal(){Store.items=lsGet(LS_Q,[]).filter(function(x){return x&&x.id});Store.sits=lsGet(LS_SIT,[]).filter(function(x){return x&&x.id});Store.sections=normSec(lsGet(LS_SEC,null))}
function saveLocal(){return lsSet(LS_Q,Store.items)}
function upsertLocal(q){var i=Store.items.findIndex(function(x){return x.id===q.id});if(i>=0)Store.items[i]=q;else Store.items.push(q)}
Store.save=function(q){
  q=clone(q);
  if(JSON.stringify(q).length>240000)return Promise.reject(new Error('This question is too large. Remove or shrink a figure.'));
  if(Store.mode==='cloud')return Store.col.doc(q.id).set(q);
  upsertLocal(q);
  return saveLocal()?Promise.resolve():Promise.reject(new Error('Browser storage is full. Export your bank and remove figures.'));
};
Store.remove=function(id){
  if(Store.mode==='cloud')return Store.col.doc(id).delete();
  Store.items=Store.items.filter(function(x){return x.id!==id});saveLocal();return Promise.resolve();
};
Store.bySubject=function(code){return Store.items.filter(function(q){return q.subject===code})};
/* situation problems: one shared scenario with one or more questions (questions carry sitId + sitOrder) */
Store.sitById=function(id){return Store.sits.filter(function(s){return s.id===id})[0]||null};
Store.saveSit=function(s){
  s=clone(s);
  if(JSON.stringify(s).length>240000)return Promise.reject(new Error('This situation is too large. Remove or shrink a figure.'));
  if(Store.mode==='cloud')return Store.col.doc(s.id).set(s);
  var i=Store.sits.findIndex(function(x){return x.id===s.id});if(i>=0)Store.sits[i]=s;else Store.sits.push(s);
  return lsSet(LS_SIT,Store.sits)?Promise.resolve():Promise.reject(new Error('Browser storage is full. Remove figures or export your bank.'));
};
Store.removeSit=function(id){
  var qs=Store.items.filter(function(q){return q.sitId===id});
  var chain=qs.reduce(function(p,q){return p.then(function(){return Store.remove(q.id)})},Promise.resolve());
  return chain.then(function(){
    if(Store.mode==='cloud')return Store.col.doc(id).delete();
    Store.sits=Store.sits.filter(function(s){return s.id!==id});lsSet(LS_SIT,Store.sits);
  });
};
Store.localCount=function(){return lsGet(LS_Q,[]).length+lsGet(LS_SIT,[]).length};
function sortItems(){Store.items.sort(function(a,b){return (b.updated||0)-(a.updated||0)})}
/* A published copy of the bank can be baked into the page (read-only, no sign-in needed). */
function readSeed(){
  try{var e=document.getElementById('bank-seed');if(!e)return null;var j=JSON.parse(e.textContent||'{}');
    return j&&((Array.isArray(j.questions)&&j.questions.length)||(Array.isArray(j.situations)&&j.situations.length))?j:null}catch(x){return null}
}
var SEED=readSeed();
function baseState(){
  Store.col=null;
  if(SEED){
    Store.mode='seed';Store.canEdit=false;Store.seeded=true;
    Store.items=(SEED.questions||[]).filter(function(q){return q&&q.id&&Array.isArray(q.choices)});
    Store.sits=(SEED.situations||[]).filter(function(s){return s&&s.id});
    Store.sections=normSec(SEED.sections);
  }else{Store.mode='local';Store.canEdit=true;loadLocal()}
  sortItems();
}
function initStore(){
  baseState();Store.ready=true;Store.onChange();
  var c=window.claude;if(!c||!c.use)return;
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db)return null;
    return Promise.all([user?user.canEdit():false,user?user.id():null]).then(function(v){return {db:db,edit:!!v[0],id:v[1]}});
  }).then(function(x){
    if(!x)return;
    /* one shared bank: everyone with the link reads it, only editors change it */
    var col=x.db.collection('bank');
    var timer=setTimeout(function(){if(!Store.synced){Store.onChange()}},10000);
    if(x.edit&&x.id){
      var pc=x.db.collection('data/users/'+x.id);
      pc.get().then(function(s){
        Store.privCol=pc;
        Store.privDocs=s.docs.filter(function(d){return d.exists}).map(function(d){return {id:d.id,data:d.data()}})
          .filter(function(d){return d.data&&(d.data.kind==='q'||d.data.kind==='settings')});
        if(Store.privDocs.length)Store.onChange();
      }).catch(function(){});
    }
    col.onSnapshot(function(snap){
      Store.mode='cloud';Store.col=col;Store.canEdit=x.edit;
      var docs=snap.docs.map(function(d){return d.data()}).filter(Boolean);
      Store.items=docs.filter(function(d){return d.kind==='q'});
      Store.sits=docs.filter(function(d){return d.kind==='sit'});
      var st=docs.filter(function(d){return d.kind==='settings'})[0];
      Store.sections=normSec(st&&st.sections);
      sortItems();
      if(!snap.metadata.fromCache){Store.synced=true;clearTimeout(timer)}
      Store.onChange();
    },function(){baseState();Store.onChange()});
  }).catch(function(){});
}
Store.migrate=function(){
  var local=lsGet(LS_Q,[]),lsits=lsGet(LS_SIT,[]);if((!local.length&&!lsits.length)||Store.mode!=='cloud')return Promise.resolve(0);
  var chain=Promise.resolve();
  var ls=normSec(lsGet(LS_SEC,null));
  SUBJECTS.forEach(function(s){ls[s.code].forEach(function(n){if(Store.sections[s.code].indexOf(n)<0)Store.sections[s.code].push(n)})});
  local.forEach(function(q){chain=chain.then(function(){return Store.col.doc(q.id).set(q)})});
  lsits.forEach(function(s){chain=chain.then(function(){return Store.col.doc(s.id).set(s)})});
  chain=chain.then(function(){return Store.saveSections()});
  return chain.then(function(){lsDel(LS_Q);lsDel(LS_SIT);lsDel(LS_SEC);return local.length});
};
Store.saveSections=function(){
  var data={kind:'settings',sections:clone(Store.sections)};
  if(Store.mode==='cloud')return Store.col.doc('settings').set(data);
  return lsSet(LS_SEC,Store.sections)?Promise.resolve():Promise.reject(new Error('Browser storage is full.'));
};
/* sections for a main subject: saved list plus any names already used by questions */
Store.sectionsFor=function(code){
  var out=(Store.sections[code]||[]).slice();
  Store.items.forEach(function(q){if(q.subject===code&&q.section&&out.indexOf(q.section)<0)out.push(q.section)});
  return out;
};

/* questions saved privately before the bank was shared move into the shared bank */
Store.migratePrivate=function(){
  var docs=Store.privDocs.slice();
  if(!docs.length||Store.mode!=='cloud'||!Store.canEdit||!Store.privCol)return Promise.resolve(0);
  var chain=Promise.resolve(),count=0;
  docs.forEach(function(d){
    if(d.data.kind==='q'){count++;chain=chain.then(function(){return Store.col.doc(d.id).set(d.data)})}
    else if(d.data.sections){SUBJECTS.forEach(function(s){(d.data.sections[s.code]||[]).forEach(function(n){
      if(typeof n==='string'&&Store.sections[s.code].indexOf(n)<0)Store.sections[s.code].push(n)})})}
  });
  chain=chain.then(function(){return Store.saveSections()});
  chain=chain.then(function(){return docs.reduce(function(p,d){return p.then(function(){return Store.privCol.doc(d.id).delete()})},Promise.resolve())});
  return chain.then(function(){Store.privDocs=[];return count});
};

/* ---------- figures: shrink uploads so each question stays small ---------- */
function shrinkImage(file,maxDim){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type))return rej(new Error('That file is not an image.'));
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('Could not read the image.'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('Could not open the image.'))};
      im.onload=function(){
        var s=Math.min(1,maxDim/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.78));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

(function(){
'use strict';
var B=window.BES,h=B.h,$=B.$,Store=B.Store;
var S=B.S={view:'home',filter:'ALL',section:'',search:'',editId:null,sitId:null,newSubject:'MSTC',newSection:'',renaming:false,delSec:false,results:null};

/* ---------- sections inside each main subject ---------- */
function secCount(code,name){return Store.items.filter(function(q){return q.subject===code&&(q.section||'')===name}).length}
function secDone(msg){
  return function(){if(msg)B.toast(msg);if(Store.mode==='local')B.render()};
}
function secFail(e){B.toast((e&&e.message)||'Could not save sections. Try again.');if(Store.mode==='local')B.render()}
function addSection(code,name){
  name=(name||'').trim().slice(0,40);
  if(!name){B.toast('Type a section name first.');return null}
  if(Store.sectionsFor(code).some(function(s){return s.toLowerCase()===name.toLowerCase()})){B.toast(name+' already exists in '+code+'.');return null}
  Store.sections[code].push(name);
  Store.saveSections().then(secDone('Added '+name+' to '+code)).catch(secFail);
  return name;
}
function renameSection(code,old,nu){
  nu=(nu||'').trim().slice(0,40);
  if(!nu||nu===old){S.renaming=false;B.render();return}
  if(Store.sectionsFor(code).some(function(s){return s!==old&&s.toLowerCase()===nu.toLowerCase()})){B.toast(nu+' already exists in '+code+'.');return}
  var list=Store.sections[code],i=list.indexOf(old);if(i>=0)list[i]=nu;else list.push(nu);
  var chain=Promise.resolve();
  Store.items.filter(function(q){return q.subject===code&&(q.section||'')===old}).forEach(function(q){
    var c=B.clone(q);c.section=nu;c.updated=Date.now();chain=chain.then(function(){return Store.save(c)})});
  chain.then(function(){return Store.saveSections()}).then(function(){if(S.section===old)S.section=nu;S.renaming=false;secDone('Renamed to '+nu)()}).catch(secFail);
}
function deleteSection(code,name){
  Store.sections[code]=Store.sections[code].filter(function(s){return s!==name});
  var chain=Promise.resolve();
  Store.items.filter(function(q){return q.subject===code&&(q.section||'')===name}).forEach(function(q){
    var c=B.clone(q);c.section='';c.updated=Date.now();chain=chain.then(function(){return Store.save(c)})});
  chain.then(function(){return Store.saveSections()}).then(function(){S.section='';S.delSec=false;S.renaming=false;secDone('Section deleted. Its questions are now unsectioned.')()}).catch(secFail);
}
/* mode 'home': compact chips that open the bank. mode 'bank': filter chips plus rename and delete. */
function sectionBox(code,mode){
  var wrap=h('div',{class:'secbox'});
  var names=Store.sectionsFor(code);
  var chips=h('div',{class:'chips'});
  if(mode==='bank')chips.appendChild(h('button',{class:'pill','aria-pressed':!S.section,onclick:function(){S.section='';S.renaming=false;S.delSec=false;B.render()}},'All sections · '+Store.bySubject(code).length));
  names.forEach(function(n){
    var cnt=secCount(code,n);
    if(mode==='bank')chips.appendChild(h('button',{class:'pill','aria-pressed':S.section===n,onclick:function(){S.section=n;S.renaming=false;S.delSec=false;B.render()}},n+' · '+cnt));
    else chips.appendChild(h('button',{class:'pill',title:'Open '+n,onclick:function(){S.filter=code;S.section=n;B.go('bank')}},n+' · '+cnt));
  });
  if(!names.length)chips.appendChild(h('span',{class:'hint',text:'No sections yet.'}));
  wrap.appendChild(chips);
  var inp=h('input',{type:'text',maxlength:40,id:'secadd-'+code+'-'+mode,placeholder:'New section in '+code,'aria-label':'New section name in '+code,
    onkeydown:function(e){if(e.key==='Enter'){e.preventDefault();doAdd()}}});
  function doAdd(){if(addSection(code,inp.value))inp.value=''}
  if(Store.canEdit)wrap.appendChild(h('div',{class:'sec-add'},inp,h('button',{class:'btn small',onclick:doAdd},'Add section')));
  if(Store.canEdit&&mode==='bank'&&S.section){
    var row=h('div',{class:'secrow'});
    if(S.renaming){
      var ri=h('input',{type:'text',maxlength:40,id:'secren','aria-label':'New name for this section',value:S.section});
      row.appendChild(ri);
      row.appendChild(h('button',{class:'btn small primary',onclick:function(){renameSection(code,S.section,ri.value)}},'Save name'));
      row.appendChild(h('button',{class:'btn small',onclick:function(){S.renaming=false;B.render()}},'Cancel'));
    }else{
      row.appendChild(h('button',{class:'btn small',onclick:function(){S.renaming=true;S.delSec=false;B.render()}},'Rename section'));
      row.appendChild(h('button',{class:'btn small danger',onclick:function(){if(!S.delSec){S.delSec=true;B.render();return}deleteSection(code,S.section)}},
        S.delSec?'Confirm delete (questions are kept)':'Delete section'));
    }
    wrap.appendChild(row);
  }
  return wrap;
}

/* ---------- shared bits ---------- */
function statusBadge(){
  var m=Store.mode,label,tip;
  if(m==='cloud'&&Store.canEdit){label='Shared bank · you can edit';tip='Everyone with the link sees these questions. Only you and other editors can change them.'}
  else if(m==='cloud'){label='Shared bank · view only';tip='These questions are managed by the owner.'}
  else if(m==='seed'){label='Published bank · view only';tip='This is a published copy of the question bank.'}
  else{label='Saved in this browser only';tip='Questions are stored in this browser only.'}
  return h('span',{class:'status'+(m==='local'?' local':''),title:tip},h('b'),label);
}
function migrateNotice(){
  if(Store.mode!=='cloud'||!Store.canEdit)return null;
  var wrap=h('div',{class:'stack'}),any=false;
  var n=Store.localCount();
  if(n){any=true;
    var btn=h('button',{class:'btn small primary',onclick:function(){btn.disabled=true;
      Store.migrate().then(function(c){B.toast('Moved '+c+' questions to the shared bank');B.render()}).catch(function(){btn.disabled=false;B.toast('Could not move questions. Try again.')})}},'Move them to the shared bank');
    wrap.appendChild(h('div',{class:'notice'},h('span',{class:'grow'},'Questions and sections saved earlier in this browser can be moved to the shared bank.'),btn));
  }
  var pq=Store.privDocs.filter(function(d){return d.data.kind==='q'}).length;
  if(Store.privDocs.length){any=true;
    var btn2=h('button',{class:'btn small primary',onclick:function(){btn2.disabled=true;
      Store.migratePrivate().then(function(c){B.toast('Moved '+c+' questions to the shared bank');B.render()}).catch(function(){btn2.disabled=false;B.toast('Could not move questions. Try again.')})}},'Move them to the shared bank');
    wrap.appendChild(h('div',{class:'notice'},h('span',{class:'grow'},pq+' question'+(pq===1?'':'s')+' you saved privately before the bank was shared can be moved to the shared bank.'),btn2));
  }
  return any?wrap:null;
}
function optsMini(q,mine){
  return h('ul',{class:'opts-mini'},q.choices.map(function(c,i){
    var ok=q.correct.indexOf(i)>=0,sel=mine&&mine.indexOf(i)>=0;
    var t=h('span',{class:'t'});B.setRich(t,c);
    return h('li',{class:(ok?'ok':'')+(sel?' mine':'')},h('span',{class:'k'},B.LETTERS[i]),t,ok?h('span',{class:'sr'},' (correct)'):null);
  }));
}
function figStrip(q){
  if(!q.figures||!q.figures.length)return null;
  return h('div',{class:'qfigs'},q.figures.map(function(src){
    return h('img',{src:src,alt:'Figure for this question',onclick:function(e){e.target.classList.toggle('zoom')}})}));
}

/* ---------- example questions ---------- */
function svgUri(s){return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}
function examples(){
  var tri=svgUri('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190"><rect width="260" height="190" fill="#fff"/>'+
    '<polygon points="30,160 230,160 30,40" fill="#e6f2e8" stroke="#1b6a39" stroke-width="3"/>'+
    '<path d="M30 140h20v20" fill="none" stroke="#1b6a39" stroke-width="2"/>'+
    '<g font-family="Georgia,serif" font-size="18" fill="#12251a"><text x="12" y="106">6 m</text><text x="116" y="182">8 m</text><text x="140" y="92" font-style="italic">c = ?</text></g></svg>');
  var now=Date.now();
  return [
    {kind:'q',id:B.uid(),subject:'MSTC',example:true,created:now,updated:now,
     text:'The right triangle in the figure has legs of 6 m and 8 m. Find the length of the hypotenuse $c$.\n\nUse $$c=\\sqrt{a^{2}+b^{2}}$$',
     choices:['8 m','10 m','12 m','14 m'],correct:[1],multi:false,figures:[tri],
     explanation:'$c=\\sqrt{6^2+8^2}=\\sqrt{100}=10$ m. This is an example question. Delete it once you add your own.'},
    {kind:'q',id:B.uid(),subject:'HGE',example:true,created:now+1,updated:now+1,
     text:'Which expression gives the area of a circle of radius $r$?',
     choices:['$\\pi r^{2}$','$2\\pi r$','$\\pi d$','$\\tfrac{1}{2}\\pi r^{2}$'],correct:[0],multi:false,figures:[],
     explanation:'Area is $A=\\pi r^{2}$. This is an example question. Delete it once you add your own.'},
    {kind:'q',id:B.uid(),subject:'PSAD',example:true,created:now+2,updated:now+2,
     text:'Select all values of $x$ that satisfy $x^{2}-5x+6=0$.',
     choices:['$x=1$','$x=2$','$x=3$','$x=6$'],correct:[1,2],multi:true,figures:[],
     explanation:'$(x-2)(x-3)=0$, so $x=2$ or $x=3$. This is an example question. Delete it once you add your own.'}
  ];
}
function addExamples(){
  var chain=Promise.resolve();
  examples().forEach(function(q){chain=chain.then(function(){return Store.save(q)})});
  return chain.then(function(){B.toast('Added 3 example questions')}).catch(function(e){B.toast(e.message||'Could not add examples')});
}

/* ---------- Home / dashboard ---------- */
var DEF={subjects:{MSTC:true,HGE:true,PSAD:true},sections:{},count:50,minutes:75,passing:75,shuffleQ:true,shuffleC:false,timeTouched:false};
function getCfg(){var c=Object.assign({},DEF,B.lsGet(B.LS_SET,{}));c.subjects=Object.assign({},DEF.subjects,c.subjects||{});c.sections=Object.assign({},c.sections||{});return c}

B.vHome=function(root){
  var cfg=getCfg();
  var saved=B.lsGet(B.LS_EXAM,null);
  var total=Store.items.length;

  root.appendChild(h('div',{class:'row'},
    h('div',{class:'grow'},h('h1',{class:'page-title',text:'Practice exams'}),
      h('p',{class:'sub',text:Store.canEdit?'Build your test bank, then sit a timed exam under board-day conditions.':'Choose your subjects, then sit a timed exam under board-day conditions.'})),
    statusBadge()));
  var mn=migrateNotice();if(mn)root.appendChild(mn);

  if(saved&&saved.end&&!saved.done){
    root.appendChild(h('div',{class:'notice'},
      h('span',{class:'grow'},'You have an unfinished exam ('+saved.qs.length+' questions). The clock kept running.'),
      h('button',{class:'btn small primary',onclick:function(){B.resumeExam()}},'Resume'),
      h('button',{class:'btn small',onclick:function(){B.lsDel(B.LS_EXAM);B.render()}},'Discard')));
  }

  /* subject cards */
  var sg=h('div',{class:'subjects'});
  B.SUBJECTS.forEach(function(s){
    var n=Store.bySubject(s.code).length;
    sg.appendChild(h('div',{class:'subj '+s.cls},
      h('div',{class:'code',text:s.code}),
      h('div',{class:'count',text:n+' question'+(n===1?'':'s')}),
      sectionBox(s.code,'home'),
      h('div',{class:'row'},
        h('button',{class:'btn small',onclick:function(){S.filter=s.code;S.section='';B.go('bank')}},'Open bank'),
        Store.canEdit?[h('button',{class:'btn small primary',onclick:function(){S.editId=null;S.newSubject=s.code;S.newSection='';B.go('editor')}},'Add question'),
          h('button',{class:'btn small',onclick:function(){S.sitId=null;S.newSubject=s.code;S.newSection='';B.go('situation')}},'Add situation')]:null)));
  });
  root.appendChild(sg);

  if(!total){
    if(Store.canEdit)root.appendChild(h('div',{class:'empty'},h('h3',{text:'Your test bank is empty'}),
      h('p',{text:'Add questions to MSTC, HGE or PSAD. Each can include figures and equations. Or load three examples to see how it works.'}),
      h('div',{class:'row'},h('button',{class:'btn primary',onclick:function(){S.editId=null;B.go('editor')}},'Add your first question'),
        h('button',{class:'btn',onclick:function(){addExamples()}},'Load example questions'))));
    else root.appendChild(h('div',{class:'empty'},h('h3',{text:'No questions yet'}),
      h('p',{text:'The owner has not added questions to this test bank yet. Check back soon.'})));
  }

  /* exam setup */
  var panel=h('section',{class:'panel'});
  panel.appendChild(h('div',{class:'panel-head'},h('div',null,h('h2',{text:'Set up an exam'}),h('p',{class:'sub',text:'Answers stay hidden until you submit, like the real thing.'}))));
  var form=h('div',{class:'setup'});
  var checks=h('div',{class:'checks'});var boxes={},selects={},nSpans={};
  B.SUBJECTS.forEach(function(s){
    var n=Store.bySubject(s.code).length;
    var cb=h('input',{type:'checkbox',id:'sub-'+s.code,checked:cfg.subjects[s.code]&&n>0,disabled:n===0,onchange:update});
    boxes[s.code]=cb;
    var nSpan=h('span',{class:'n',text:n+' available'});nSpans[s.code]=nSpan;
    var item=h('div',{class:'chk-wrap'},h('label',{class:'chk '+s.cls,for:'sub-'+s.code},cb,h('span',{class:'tag',text:s.code}),nSpan));
    var secs=Store.sectionsFor(s.code).filter(function(x){return secCount(s.code,x)>0});
    if(secs.length){
      var sel=h('select',{id:'secsel-'+s.code,'aria-label':'Limit '+s.code+' to one section',onchange:update},
        h('option',{value:''},'All sections in '+s.code),
        secs.map(function(x){return h('option',{value:x,selected:cfg.sections[s.code]===x},x+' · '+secCount(s.code,x))}));
      selects[s.code]=sel;item.appendChild(sel);
    }
    checks.appendChild(item);
  });
  form.appendChild(h('div',{class:'field'},h('span',{class:'lbl',text:'Subjects'}),checks));

  var count=h('input',{type:'number',id:'cfg-count',min:1,value:cfg.count,oninput:function(){update('count')}});
  var mins=h('input',{type:'number',id:'cfg-min',min:1,value:cfg.minutes,oninput:function(){cfg.timeTouched=true;update()}});
  var pass=h('input',{type:'number',id:'cfg-pass',min:1,max:100,value:cfg.passing,oninput:function(){update()}});
  form.appendChild(h('div',{class:'stack'},
    h('div',{class:'field'},h('label',{for:'cfg-count',text:'Number of questions'}),count),
    h('div',{class:'field'},h('label',{for:'cfg-min',text:'Time limit (minutes)'}),mins)));
  var sq=h('input',{type:'checkbox',id:'cfg-sq',checked:cfg.shuffleQ,onchange:update});
  var sc=h('input',{type:'checkbox',id:'cfg-sc',checked:cfg.shuffleC,onchange:update});
  form.appendChild(h('div',{class:'stack'},
    h('div',{class:'field'},h('label',{for:'cfg-pass',text:'Passing mark (%)'}),pass),
    h('label',{class:'sw',for:'cfg-sq'},sq,'Shuffle question order'),
    h('label',{class:'sw',for:'cfg-sc'},sc,'Shuffle answer choices')));
  panel.appendChild(form);

  var sum=h('p',{class:'sum'});
  var go=h('button',{class:'btn primary',id:'start-btn',onclick:function(){start()}},'Start exam');
  panel.appendChild(h('div',{class:'row',style:'margin-top:18px'},go,sum));
  root.appendChild(panel);

  function secOf(code){return selects[code]?selects[code].value:''}
  function avail(code){var sec=secOf(code);return Store.bySubject(code).filter(function(q){return !sec||(q.section||'')===sec})}
  function pool(){return B.SUBJECTS.filter(function(s){return boxes[s.code].checked}).reduce(function(a,s){return a.concat(avail(s.code))},[])}
  function read(){
    return {subjects:Object.keys(boxes).reduce(function(o,k){o[k]=boxes[k].disabled?cfg.subjects[k]!==false:boxes[k].checked;return o},{}),
      sections:Object.keys(selects).reduce(function(o,k){o[k]=selects[k].value;return o},{}),
      count:parseInt(count.value,10)||0,minutes:parseInt(mins.value,10)||0,passing:parseInt(pass.value,10)||75,
      shuffleQ:sq.checked,shuffleC:sc.checked,timeTouched:cfg.timeTouched};
  }
  function update(what){
    B.SUBJECTS.forEach(function(s){nSpans[s.code].textContent=avail(s.code).length+' available'});
    var p=pool().length;var c=read();
    if(what==='count'&&!cfg.timeTouched&&c.count>0){mins.value=Math.max(1,Math.round(Math.min(c.count,p||c.count)*1.5));c=read()}
    B.lsSet(B.LS_SET,Object.assign({},c,{subjects:Object.assign({},getCfg().subjects,c.subjects)}));
    var n=Math.min(c.count,p);
    go.disabled=!(p>0&&c.count>0&&c.minutes>0);
    sum.textContent=p?(n+' of '+p+' questions · '+c.minutes+' min · pass at '+c.passing+'%'):'Tick a subject that has questions.';
  }
  function start(){
    var c=read();var p=pool();if(!p.length)return;
    var pk=B.pickQuestions(p,Math.max(1,Math.min(c.count,p.length)),c.shuffleQ);
    B.startExam({qs:pk.qs,sits:pk.sits,minutes:c.minutes,passing:c.passing,shuffleC:c.shuffleC});
  }
  update();

  /* recent attempts */
  var hist=B.lsGet(B.LS_HIST,[]);
  if(hist.length){
    var hp=h('section',{class:'panel'},h('h2',{text:'Recent attempts'}));
    var list=h('div',{class:'hist',style:'margin-top:10px'});
    hist.slice(0,6).forEach(function(r){
      list.appendChild(h('div',null,h('span',{text:new Date(r.date).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}),
        h('span',{text:r.subjects.join(' + ')+' · '+r.correct+'/'+r.total}),
        h('span',{class:'pf',style:'color:var(--'+(r.passed?'good':'bad')+')',text:r.percent+'% · '+(r.passed?'Passed':'Below mark')})));
    });
    hp.appendChild(list);root.appendChild(hp);
  }
};

    var shownSit={};
    function sitNote(q){
      var s=q.sitId&&r.sits&&r.sits[q.sitId];if(!s)return null;
      if(shownSit[q.sitId])return h('div',{class:'qmeta',text:'Same situation as above'+(s.title?': '+s.title:'')});
      shownSit[q.sitId]=1;return B.sitBox(s,'',true);
    }
    var shown=r.qs.map(function(q,i){return {q:q,i:i}}).filter(function(x){return mode==='all'||status(x.q)===mode});
    if(!shown.length)list.appendChild(h('div',{class:'empty'},h('h3',{text:'Nothing in this group'})));
    shown.forEach(function(x){
      var q=x.q,st=status(q),mine=r.answers[q.id]||[];
      var body=h('div',{class:'qtext'});B.setRich(body,q.text);
      var figs=q.figures&&q.figures.length?h('div',{class:'qfigs'},q.figures.map(function(src){return h('img',{src:src,alt:'Figure',onclick:function(e){e.target.classList.toggle('zoom')}})})):null;
      var ul=h('ul',{class:'opts-mini'});
      r.order[q.id].forEach(function(orig,pos){
        var t=h('span',{class:'t'});B.setRich(t,q.choices[orig]);
        var ok=q.correct.indexOf(orig)>=0,sel=mine.indexOf(orig)>=0;
        ul.appendChild(h('li',{class:(ok?'ok':'')+(sel?' mine':'')},h('span',{class:'k',text:B.LETTERS[pos]}),t,
          h('span',{class:'qmeta'},(sel?'Your answer':'')+(sel&&ok?' · ':'')+(ok?'Correct':''))));
      });
      var lab=st==='ok'?'Correct':st==='no'?'Incorrect':'Unanswered';
      var rev=h('article',{class:'rev '+st},
        h('div',{class:'qno'},'Question '+(x.i+1),h('span',{class:'tag '+B.subjCls(q.subject),text:q.subject}),q.section?h('span',{text:q.section}):null,h('strong',{text:lab}),r.flags[q.id]?h('span',{text:'Flagged'}):null),
        sitNote(q),body,figs,ul);
      if(q.explanation){var ex=h('div',{class:'expl'});B.setRich(ex,q.explanation);rev.appendChild(h('div',{class:'lbl',text:'Explanation'}));rev.appendChild(ex)}
      list.appendChild(rev);
    });
  }
  root.appendChild(h('h2',{text:'Review your answers'}));
  root.appendChild(pills);root.appendChild(list);
  drawPills();drawList();

  function retake(){
    var minutes=Math.max(1,Math.round(r.allotted/60));
    var qs=B.clone(r.qs);
    B.startExam({qs:qs,sits:B.clone(r.sits||{}),minutes:minutes,passing:r.passing,shuffleC:true});
  }
};

/* ---------- router + boot ---------- */
var TABS=[['home','Dashboard'],['bank','Question bank'],['editor','Add question'],['situation','Add situation'],['results','Last results']];
B.go=function(v){S.view=v;B.render();window.scrollTo({top:0})};
B.render=function(){
  clearInterval(tickId);
  if(keyFn&&S.view!=='exam'){document.removeEventListener('keydown',keyFn);keyFn=null}
  var inExam=S.view==='exam'&&E;
  if(S.view==='exam'&&!E)S.view='home';
  $('.bar').hidden=!!inExam;
  var app=$('#app');B.clear(app);
  var tabs=$('#tabs');B.clear(tabs);
  TABS.forEach(function(t){
    if((t[0]==='editor'||t[0]==='situation')&&!Store.canEdit)return;
    if(t[0]==='results'&&!S.results)return;
    var cur=S.view===t[0]||(S.view==='editor'&&t[0]==='editor');
    tabs.appendChild(h('button',{class:'tab','aria-current':cur?'page':null,onclick:function(){if(t[0]==='editor')S.editId=null;if(t[0]==='situation')S.sitId=null;B.go(t[0])}},t[1]));
  });
  if(S.view==='exam')B.vExam(app);
  else if(S.view==='results')B.vResults(app);
  else if(S.view==='editor')B.vEditor(app);
  else if(S.view==='situation')B.vSituation(app);
  else if(S.view==='bank')B.vBank(app);
  else B.vHome(app);
};
Store.onChange=function(){if(S.view==='home'||S.view==='bank')B.render()};

(function boot(){
  S.results=B.lsGet(LS_LAST,null);
  var saved=B.lsGet(B.LS_EXAM,null);
  B.initStore();
  if(saved&&saved.qs&&saved.end&&Date.now()<saved.end){B.resumeExam();return}
  if(saved&&saved.qs&&saved.end){E=saved;finish(true);return}
  B.render();
})();
})();

</script>
</body>
</html>
